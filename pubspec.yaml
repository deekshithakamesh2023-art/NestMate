name: nestmate_portal
description: A fresh Cupertino hostel resident and warden portal prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cloud_firestore: ^7.0.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/images/vit_chennai_logo.png
    - assets/images/vit_chennai_campus.png
    - assets/images/vit_chennai_login_background.png
